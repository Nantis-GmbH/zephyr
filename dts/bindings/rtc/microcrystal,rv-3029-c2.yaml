description: Micro Crystal RV-3029-C2 RTC

compatible: "microcrystal,rv-3029-c2"

include:
  - name: rtc-device.yaml
  - name: i2c-device.yaml

properties:
  int-gpios:
    type: phandle-array
    description: |
      Optional GPIO connected to the active-low open-drain INT output.

  clkoe-gpios:
    type: phandle-array
    description: |
      Optional GPIO driving the CLKOE input to enable the CLKOUT pin.